name: CI

# Verifies the frontend from scratch: format, lint, types, unit tests, production build, the versioned API contract
# and the dependency audit. It needs no database and no backend: contract:check works on the copy in contract/.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify frontend
    # Pinned: ubuntu-latest moves to a new major image without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      HUSKY: '0'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies (blocking)
        run: npm audit --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the API contract types
        run: npm run contract:check
