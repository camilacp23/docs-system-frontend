        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Collections]
      operationId: createCollection
      x-capability: 'CRUD of variables and collections'
      x-roles: [ADMINISTRATOR, DEVELOPER]
      summary: Register a collection with its fields and assignments (FR-08, FR-09)
      x-error-codes: [APPLICATION_ARCHIVED, SCOPE_MISMATCH, CROSS_APPLICATION, CONTEXT_SCREEN_MISMATCH, DUPLICATE_NAME]
      description: |
        Roles: Administrator, Developer. When the application is archived it is
        read-only (CP-01): this operation returns 422 APPLICATION_ARCHIVED for every
        role.
        404 when `applicationId`, or a variable, screen or collection referenced by
        the body, does not exist; `details.field` gives the position of the
        reference. The name must be free in the application: 409 DUPLICATE_NAME with
