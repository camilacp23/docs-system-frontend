    put:
      tags: [Applications]
      operationId: updateApplication
      x-capability: 'Manage applications (proposed row)'
      x-roles: [ADMINISTRATOR]
      summary: Update or archive an application
      description: |
        Roles: Administrator. Applications are archived (status ARCHIVED), never deleted.
        The body replaces the whole editable representation: an omitted `description`
        or `jiraProjectKey` is stored as null (null `jiraProjectKey` = the department
        default project, TECHEA).
        `status: ARCHIVED` makes the application's documentation read-only for every
        role (CP-01): writes on its variables, collections, screens, status, Jira
        tickets, review and comments return 422 APPLICATION_ARCHIVED. Reports can
        still be generated and downloaded. `status: ACTIVE` restores editing; this
        operation is the only write accepted on an archived application.
      parameters:
