openapi: 3.1.0
info:
  title: Technical Documentation System API
  version: 0.3.5
  summary: REST API contracts — SDD Interface Viewpoint (Bitácora 3, Activities 5 and 6)
  description: |
    Contracts of the eleven modules (41 operations of SRS Table 25), the
    Applications resource (NFR-16), the saved-reports operations (FR-22), and
    the Jira Cloud webhook.

    Conventions (SDD Section 7.1):
    - Base path `/api/v1`, HTTPS only (NFR-04), JSON UTF-8, fields in camelCase.
    - Collections: `{ data, page, pageSize, total }`. Single resources: `{ data }`.
    - Errors: `{ code, message, details }` (SRS 3.7).
    - Element listings require `applicationId`.
    - PUT replaces the whole editable representation, nested arrays included.
    - Optional optimistic concurrency: send `If-Match` with the `ETag` of the
      last read; a mismatch returns 412.
    - Every GET returns an `ETag`. Send it back in `If-None-Match`: when nothing
      changed the answer is 304 with no body.
    - Every response, success or error, carries the `X-Request-Id` header. A
      value sent by the client is kept when it has 8 to 64 characters among
      letters, digits, `.`, `_` and `-`; otherwise the server generates one.
      `INTERNAL_ERROR` repeats it in `details.requestId`.
    - Writes on variables, collections and screens check, in this order: the shape of the request (400), that the
      referenced resources exist (404), that the application is not archived
      (422 `APPLICATION_ARCHIVED`), `If-Match` (412), the business rules (422)
      and the name (409 `DUPLICATE_NAME`).
    - Authorization: every endpoint validates the role (NFR-03); the role and
      status are read from the database on each request, not trusted from the
      token, so role changes and deactivations take effect immediately.
    - Each operation declares `x-capability` (row of SRS Table 26), `x-roles`
      (empty = no user role: public, session cookie, or Jira signature) and,
      when a data rule applies, `x-rule`. The authorization middleware is
      generated from these extensions (SDD Section 11).
    - Every user-facing `message` is in English (CP-04). Values in `<...>` are
      filled in from `details`.

    Changes in 0.3.0 (design review of 5 Oct 2026, CP-01 to CP-11; SDD D-47 to D-58):
    archived applications are read-only (CP-01); `GET /search` without `q` (CP-03);
    English messages (CP-04); `topComponents` in onboarding (CP-05); reserved
    integration account (CP-06); context variables belong to their origin screen
    (CP-07); no editing while in review (CP-08); sort by `pendingSubtasks` (CP-09);
    report `parameters` in the detail (CP-10); review decision on comments (CP-11).
    No operation was added or removed (50).

    Changes in 0.3.1 (Phase 3 decisions D-61 and D-64): `SessionResponse.data`
    gains the required `sessionExpiresIn` (seconds until the absolute end of the
    12 h session; returned by login and refresh). `CONTEXT_SCREEN_MISMATCH` also
    covers a context variable that has no origin screen, with its own message and
    `details`. The `ETag` header is now documented on the 201 of `POST /users` and
    on the 200 of `PUT /users/{id}/role`. No operation was added or removed (50).

    Changes in 0.3.2 (applications): the `ETag` header is now documented on the
    201 of `POST /applications`. `GET /applications` states its default order
    (name ascending, then id). `PUT /applications/{id}` states its full-replacement
    semantics: an omitted `description` or `jiraProjectKey` is stored as null.
    No operation was added or removed (50).

    Changes in 0.3.3 (variables and collections): every response documents the
    `X-Request-Id` header, and every GET documents the `ETag` header, the
    `If-None-Match` parameter and the 304 response. The 401 of
    `POST /auth/refresh` is `REFRESH_INVALID`, and `POST /auth/refresh` and
    `POST /auth/logout` declare the 403 FORBIDDEN (`details.reason = ORIGIN`) they
    return when the request does not come from the frontend's Origin. Listings answer 404 for an
    `applicationId` that does not exist, and `POST /variables` and
    `POST /collections` answer 404 for a referenced resource that does not exist
    and send the `ETag` of the created resource. `DUPLICATE_NAME` states the
    scope where a name must be unique and its `details.container`.
    `INVALID_ORIGIN_SCREEN` has a second message for an origin screen of another
    application, which replaces `CROSS_APPLICATION` in `POST /variables`.
    `CROSS_APPLICATION`, `SCOPE_MISMATCH` and `CONTEXT_SCREEN_MISMATCH` on
    collections name the failing item in `details.field`, and the order in which
    the rules are applied is documented. `PUT /variables/{id}` and
    `PUT /collections/{id}` document `If-Match` and the update that changes
    nothing; `PUT /collections/{id}` documents that omitted arrays are emptied,
    and its nested ids answer 404 `details.field` when they are not found.
    `derivedFrom` states its direction, that a collection cannot derive from
    itself (400, rule `self`) and that cycles are allowed. A repeated environment
    or `derivedFrom` item is a 400 with its position: `uniqueItems` was removed
    from those three arrays so that the server reports them all the same way.
    `untraced=false` and `undocumented=false` are the same as omitting them, and
    a filter by an id that does not exist returns an empty page. The `screens`
    of `GET /variables/{id}/dependencies` no longer say they include the origin
    row. `x-error-codes` now lists `DUPLICATE_NAME` on the operations that can
    return it and no longer lists `CROSS_APPLICATION` on `PUT /variables/{id}`.
    No operation was added or removed (50).

    Changes in 0.3.4 (screens and the documentation workflow): `POST /screens`
    sends the `ETag` of the created screen, and `PUT /screens/{id}/status` and
    `POST /screens/{id}/review` send the `ETag` of the screen with its new status.
    `DUPLICATE_NAME` is documented on `POST` and `PUT /screens`, `SCREEN_IN_REVIEW`
    on `DELETE /screens/{id}` and `APP_CONTEXT_PROTECTED` (second message: the
    App (OnStart) screen cannot be renamed) on `PUT /screens/{id}`. The
    operations describe the status a screen gets when it is created or edited,
    that the four lists of `ScreenWrite` are required and only `uses` is optional,
    that the `origin` links are read-only, that the cross-application and context
    rules judge only new or modified links, and the order of the errors of
    `/status` and `/review`. `POST /screens/{id}/review` has no `If-Match`: a
    RETURN without `comment`, with `""` or with `null` is a 400, one with only
    spaces is a 422 `COMMENT_REQUIRED`, and an APPROVE with only spaces creates
    no comment. The error examples show the position (`details.field`) of the
    failing item, `TEMPLATE_INCOMPLETE` lists the fields in the order of the
    template, and `AuditEntry` describes the payload of the review events. No
    operation was added or removed (50).

    Changes in 0.3.5 (Jira integration): `POST /screens/{id}/jira-ticket`
    describes the flow (Epic created once per screen, Story chosen or new,
    Subtask), the project and the summary of the Epic, the provisional values
    of the 201, the order of the errors, the 400 rules of the summaries
    (`required`, `minLength`, `singleLine`, `maxLength` counted as Jira counts it),
    the order of `created`, the link of each issue and why the 201 has no
    `Location`. `STORY_NOT_IN_SCREEN` lists its cases, and `JIRA_PARTIAL_FAILURE`
    has four messages (story created, only the epic created, screen deleted,
    issues not saved) with the shape of their `details`, each with an example.
    `GET /screens/{id}/jira-tickets` states what `refresh` does and writes,
    the meaning of `sync` in every case, the order of the tree, the ETag and
    the 304. `POST /integrations/jira/webhook` states the order of its rules,
    when it answers 400, 401, 413 and 204, which events are ignored, and that
    `jira:issue_created` is accepted and ignored. `issue.key` of the event is
    optional, as `issue.id` is the only field the server requires.
    `JiraHierarchyLevel` documents its correspondence with the level of Jira
    (1, 0 and -1). No operation was added or removed (50).

    Error catalog (`code` -> HTTP status: `message`):

    | Code | HTTP | Message |
    |---|---|---|
    | VALIDATION_ERROR | 400 | Check the highlighted fields. |
    | INVALID_CREDENTIALS | 401 | The email or password is incorrect. |
    | UNAUTHENTICATED, TOKEN_EXPIRED | 401 | Your session is not valid. Sign in again. |
    | REFRESH_INVALID | 401 | Your session ended. Sign in again to continue. |
    | INVALID_SIGNATURE | 401 | Invalid webhook signature. (Jira only) |
    | FORBIDDEN | 403 | Your role doesn't allow this action. (`details`: requiredRoles) |
    | FORBIDDEN (origin) | 403 | This request's origin isn't allowed. (`details`: reason = ORIGIN; refresh and logout only) |
    | NOT_FOUND | 404 | This <element> doesn't exist. It may have been deleted. |
    | DUPLICATE_NAME | 409 | A <type> named <name> already exists in <application>. (`details`: field, type, name, application, container) |
    | EMAIL_TAKEN | 409 | A user with this email already exists. |
    | REPORT_NOT_READY | 409 | Only ready reports can be published or downloaded. |
    | PRECONDITION_FAILED | 412 | Someone else saved changes to this <element> after you opened it. Reload to see their version. |
    | PAYLOAD_TOO_LARGE | 413 | This is too much text to save at once. Shorten the longest fields and try again. |
    | SCOPE_MISMATCH | 422 | Set applies to global variables and UpdateContext to context variables. |
    | SCOPE_CONFLICT | 422 | You can't change the scope while collections assign this variable with <function>. Update those assignments first. |
    | CROSS_APPLICATION | 422 | You can only link elements of the same application. (`details`: field, when the service reports it) |
    | INVALID_ORIGIN_SCREEN | 422 | Context variables are created inside a screen, not in App (OnStart). (`details`: field) |
    | INVALID_ORIGIN_SCREEN (other application) | 422 | <screen> belongs to another application. Choose a screen of <application>. (`details`: field, screenId, screen, application) |
    | CONTEXT_SCREEN_MISMATCH | 422 | <variable> belongs to <screen>. From here you can only write it with Navigate. (`details`: variableId, variable, originScreenId, screen, screenId, targetScreen, field) |
    | CONTEXT_SCREEN_MISMATCH (no origin screen) | 422 | <variable> has no origin screen. Set its origin screen before linking it. (`details`: variableId, variable, originScreenId: null, screenId, targetScreen, field) |
    | LAST_ACTIVE_ADMIN | 422 | There must be at least one active administrator. Promote another user first. |
    | CANNOT_DEACTIVATE_SELF | 422 | You can't deactivate your own account. |
    | RESERVED_ACCOUNT | 422 | This is a system account and can't be changed. |
    | APPLICATION_ARCHIVED | 422 | This application is archived, so its documentation can't be changed. |
    | INVALID_TRANSITION | 422 | This screen changed status meanwhile. Reload to see its current status. (`details`: from, to) |
    | NOT_IN_REVIEW | 422 | This screen is no longer in review. Reload to see its status. |
    | SCREEN_IN_REVIEW | 422 | This screen is in review. Edit it after the review, or withdraw it from review. |
    | TEMPLATE_INCOMPLETE | 422 | Complete all seven template fields to submit for review. Missing: <fields>. (`details`: fields, in template order) |
    | COMMENT_REQUIRED | 422 | Write a comment: it is required to return the documentation. |
    | REVIEW_COMMENT_LOCKED | 422 | Review decisions can't be edited. |
    | APP_CONTEXT_PROTECTED | 422 | The App (OnStart) screen can't be deleted. |
    | APP_CONTEXT_PROTECTED (rename) | 422 | The App (OnStart) screen can't be renamed. |
    | STORY_NOT_IN_SCREEN | 422 | That story doesn't belong to this screen. Refresh the list and pick again. (`details`: storyId) |
    | RATE_LIMITED | 429 | Too many attempts. Try again in <n> minutes. |
    | INTERNAL_ERROR | 500 | Something went wrong on our side. Try again in a moment. Reference: <requestId>. |
    | JIRA_UNAVAILABLE | 502 | Jira isn't responding. The to-do wasn't created. Try again in a few minutes. (Jira not configured, circuit breaker open, or Jira failed before anything was created) |
    | JIRA_PARTIAL_FAILURE | 502 | The story <key> was created, but the to-do wasn't. Try again to add it to that story. (`details`: key, created, storyId) |
    | JIRA_PARTIAL_FAILURE (only the epic) | 502 | The epic <key> was created, but the story and the to-do weren't. Try again to add them to that epic. (`details`: key, created) |
    | JIRA_PARTIAL_FAILURE (screen deleted) | 502 | The screen was deleted while the tickets were being created. These Jira issues weren't saved here: <keys>. Delete them in Jira if you don't need them. (`details`: created, unsaved, reason = SCREEN_DELETED) |
    | JIRA_PARTIAL_FAILURE (not saved) | 502 | These Jira issues were created but couldn't be saved here: <keys>. Delete them in Jira, then try again. (`details`: created, unsaved, reason = SAVE_FAILED) |

    In `DUPLICATE_NAME`, `<type>` is the noun in lowercase (`global variable`,
    `context variable`, `collection`, `screen`, `application`; `An` before a vowel) and
    `<application>` is the place where the name must be unique, which
    `details.container` names: `application` (global variables, collections,
    screens and context variables without an origin screen: the name of the
    application),
    `screen` (context variables with an origin screen: the name of that screen) or
    `system` (applications: Documentación técnica).

    Each operation that can answer 422 lists its possible codes in `x-error-codes`.
  contact:
    name: Enterprise Architecture Department
  license:
    name: Internal use - Enterprise Architecture Department, Universidad Latina de Costa Rica
    identifier: LicenseRef-Internal-Use
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost:3000
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Module 1 — authentication (FR-01, NFR-01)
  - name: Users
    description: Module 1 — user administration (FR-02 to FR-04)
  - name: Applications
    description: Documented applications (NFR-16; proposed FR-27)
  - name: Variables
    description: Module 2 — variables (FR-05 to FR-07)
  - name: Collections
    description: Module 3 — collections (FR-08, FR-09)
  - name: Screens
    description: Module 4 — screens, documentation workflow, Jira tickets (FR-10 to FR-14)
  - name: Dependencies
    description: Module 5 — dependency map (FR-15, FR-16)
  - name: Search
    description: Module 6 — advanced search (FR-17, FR-18)
  - name: Dashboard
    description: Module 7 — indicators (FR-19)
  - name: Audit
    description: Module 8 — audit history (FR-20, FR-21)
  - name: Reports
    description: Module 9 — reports (FR-22, NFR-12)
  - name: Comments
    description: Module 10 — comments and review (FR-23, FR-24)
  - name: Onboarding
    description: Module 11 — onboarding (FR-25)
  - name: Integrations
    description: Jira Cloud webhook (FR-12, NFR-14)

paths:
  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-capability: 'Authentication (public)'
      x-roles: []
      summary: Log in with e-mail and password
      description: |
        Issues an access token (JWT, 8 h, NFR-01) in the body and a refresh token
        in an HttpOnly, Secure, SameSite=Strict cookie scoped to `/api/v1/auth`.
        The session ends 12 hours after login; refreshing never extends it.
        Invalid credentials and inactive accounts return the same 401, so the
        response does not reveal which e-mails exist. The reserved integration
        account (the e-mail in `INTEGRATION_USER_EMAIL`, CP-06) always receives
        that same 401 INVALID_CREDENTIALS, before the password is compared;
        bcrypt still runs so the response time does not reveal it.
        Rate limited per IP and e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: ana.mora@dept.local, password: 'S3gura!Clave2026' }
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: Refresh token cookie
              schema: { type: string, example: 'rt=<opaque>; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict; Expires=<login + 12 h>' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      x-capability: 'Authentication (public)'
      x-roles: []
      summary: Renew the access token with the refresh-token cookie
      description: |
        Rotates the refresh token (the old one is revoked). Presenting a refresh
        token that was already rotated revokes its whole family and returns 401.
        The request must carry the frontend's `Origin` header (CSRF defense):
        otherwise 403 FORBIDDEN with `details.reason = ORIGIN`.
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: New access token; rotated cookie
          headers:
            Set-Cookie:
              schema: { type: string }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/RefreshInvalid' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-capability: 'Authentication (public)'
      x-roles: []
      summary: End the session
      description: |
        Revokes the refresh token and clears the cookie. Idempotent. The request must
        carry the frontend's `Origin` header (CSRF defense): otherwise 403 FORBIDDEN
        with `details.reason = ORIGIN`.
      security: [{ refreshCookie: [] }, {}]
      responses:
        '204': { description: Session closed, headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } } }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: List users
      description: |
        Roles: Administrator. The reserved integration account (CP-06) is never
        listed, and `total` does not count it. The user screen opens filtered by
        `status=ACTIVE`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: sort
          in: query
          description: 'Allowed: name, email, createdAt, lastLoginAt; prefix - for descending.'
          schema: { type: string, default: name, example: '-lastLoginAt' }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Page of users
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Register a user (FR-02)
      description: 'Roles: Administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
            example: { name: Ana Mora, email: ana.mora@dept.local, password: 'S3gura!Clave2026', role: DEVELOPER }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      operationId: getUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      x-rule: SELF_OR_ROLE
      summary: Get a user
      description: |
        Roles: Administrator, or any authenticated user for their own id.
        The reserved integration account (CP-06) answers 404, as if it did not exist.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      operationId: updateUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Update a user's data, status, or password
      x-error-codes: [CANNOT_DEACTIVATE_SELF, LAST_ACTIVE_ADMIN, RESERVED_ACCOUNT]
      description: |
        Roles: Administrator. The role is changed only through `PUT /users/{id}/role`.
        An administrator cannot deactivate themself, and the last active
        administrator cannot be deactivated.
        The reserved integration account (CP-06) cannot be changed: 422
        RESERVED_ACCOUNT.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/RuleViolation' }
    delete:
      tags: [Users]
      operationId: deactivateUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Deactivate a user (logical deletion)
      x-error-codes: [CANNOT_DEACTIVATE_SELF, LAST_ACTIVE_ADMIN, RESERVED_ACCOUNT]
      description: |
        Roles: Administrator. Sets status INACTIVE and revokes all the user's
        refresh tokens; the row is never physically deleted, so authorship and
        audit history remain intact (SDD D-09). Idempotent.
        The reserved integration account (CP-06) cannot be changed: 422
        RESERVED_ACCOUNT.
      responses:
        '204': { description: Deactivated, headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Users]
      operationId: changeUserRole
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Assign or change a user's role (FR-03)
      x-error-codes: [LAST_ACTIVE_ADMIN, RESERVED_ACCOUNT]
      description: |
        Roles: Administrator. The last active administrator cannot be demoted. The
        reserved integration account (CP-06) cannot be changed: 422 RESERVED_ACCOUNT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
            example: { role: READER }
      responses:
        '200':
          description: Role changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
