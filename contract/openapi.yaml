    variables:
      host:
        default: localhost:3000
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Module 1 — authentication (FR-01, NFR-01)
  - name: Users
    description: Module 1 — user administration (FR-02 to FR-04)
  - name: Applications
    description: Documented applications (NFR-16; proposed FR-27)
  - name: Variables
    description: Module 2 — variables (FR-05 to FR-07)
  - name: Collections
    description: Module 3 — collections (FR-08, FR-09)
  - name: Screens
    description: Module 4 — screens, documentation workflow, Jira tickets (FR-10 to FR-14)
  - name: Dependencies
    description: Module 5 — dependency map (FR-15, FR-16)
  - name: Search
    description: Module 6 — advanced search (FR-17, FR-18)
  - name: Dashboard
    description: Module 7 — indicators (FR-19)
  - name: Audit
    description: Module 8 — audit history (FR-20, FR-21)
  - name: Reports
    description: Module 9 — reports (FR-22, NFR-12)
  - name: Comments
    description: Module 10 — comments and review (FR-23, FR-24)
  - name: Onboarding
    description: Module 11 — onboarding (FR-25)
  - name: Integrations
    description: Jira Cloud webhook (FR-12, NFR-14)

paths:
  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-capability: 'Authentication (public)'
      x-roles: []
      summary: Log in with e-mail and password
      description: |
        Issues an access token (JWT, 8 h, NFR-01) in the body and a refresh token
        in an HttpOnly, Secure, SameSite=Strict cookie scoped to `/api/v1/auth`.
        The session ends 12 hours after login; refreshing never extends it.
        Invalid credentials and inactive accounts return the same 401, so the
        response does not reveal which e-mails exist. The reserved integration
        account (the e-mail in `INTEGRATION_USER_EMAIL`, CP-06) always receives
        that same 401 INVALID_CREDENTIALS, before the password is compared;
        bcrypt still runs so the response time does not reveal it.
        Rate limited per IP and e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: ana.mora@dept.local, password: 'S3gura!Clave2026' }
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: Refresh token cookie
              schema: { type: string, example: 'rt=<opaque>; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict; Expires=<login + 12 h>' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      x-capability: 'Authentication (public)'
      x-roles: []
      summary: Renew the access token with the refresh-token cookie
      description: |
        Rotates the refresh token (the old one is revoked). Presenting a refresh
        token that was already rotated revokes its whole family and returns 401.
        The request must carry the frontend's `Origin` header (CSRF defense):
        otherwise 403 FORBIDDEN with `details.reason = ORIGIN`.
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: New access token; rotated cookie
          headers:
            Set-Cookie:
              schema: { type: string }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/RefreshInvalid' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-capability: 'Authentication (public)'
      x-roles: []
      summary: End the session
      description: |
        Revokes the refresh token and clears the cookie. Idempotent. The request must
        carry the frontend's `Origin` header (CSRF defense): otherwise 403 FORBIDDEN
        with `details.reason = ORIGIN`.
      security: [{ refreshCookie: [] }, {}]
      responses:
        '204': { description: Session closed, headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } } }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: List users
      description: |
        Roles: Administrator. The reserved integration account (CP-06) is never
        listed, and `total` does not count it. The user screen opens filtered by
        `status=ACTIVE`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: sort
          in: query
          description: 'Allowed: name, email, createdAt, lastLoginAt; prefix - for descending.'
          schema: { type: string, default: name, example: '-lastLoginAt' }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Page of users
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Register a user (FR-02)
      description: 'Roles: Administrator.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
            example: { name: Ana Mora, email: ana.mora@dept.local, password: 'S3gura!Clave2026', role: DEVELOPER }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      operationId: getUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      x-rule: SELF_OR_ROLE
      summary: Get a user
      description: |
        Roles: Administrator, or any authenticated user for their own id.
        The reserved integration account (CP-06) answers 404, as if it did not exist.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The user
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      operationId: updateUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Update a user's data, status, or password
      x-error-codes: [CANNOT_DEACTIVATE_SELF, LAST_ACTIVE_ADMIN, RESERVED_ACCOUNT]
      description: |
        Roles: Administrator. The role is changed only through `PUT /users/{id}/role`.
        An administrator cannot deactivate themself, and the last active
        administrator cannot be deactivated.
        The reserved integration account (CP-06) cannot be changed: 422
        RESERVED_ACCOUNT.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/RuleViolation' }
    delete:
      tags: [Users]
      operationId: deactivateUser
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Deactivate a user (logical deletion)
      x-error-codes: [CANNOT_DEACTIVATE_SELF, LAST_ACTIVE_ADMIN, RESERVED_ACCOUNT]
      description: |
        Roles: Administrator. Sets status INACTIVE and revokes all the user's
        refresh tokens; the row is never physically deleted, so authorship and
        audit history remain intact (SDD D-09). Idempotent.
        The reserved integration account (CP-06) cannot be changed: 422
        RESERVED_ACCOUNT.
      responses:
        '204': { description: Deactivated, headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Users]
      operationId: changeUserRole
      x-capability: 'User management and role assignment'
      x-roles: [ADMINISTRATOR]
      summary: Assign or change a user's role (FR-03)
      x-error-codes: [LAST_ACTIVE_ADMIN, RESERVED_ACCOUNT]
      description: |
        Roles: Administrator. The last active administrator cannot be demoted. The
        reserved integration account (CP-06) cannot be changed: 422 RESERVED_ACCOUNT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
            example: { role: READER }
      responses:
        '200':
          description: Role changed
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ---------------------------------------------------------- Applications
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      x-capability: 'Manage applications (proposed row)'
      x-roles: [ADMINISTRATOR, DEVELOPER, READER]
      summary: List documented applications
      description: 'Roles: all. Ordered by name ascending (then id); there is no `sort` parameter.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Page of applications
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Applications]
      operationId: createApplication
      x-capability: 'Manage applications (proposed row)'
      x-roles: [ADMINISTRATOR]
      summary: Register an application
      description: 'Roles: Administrator. The App (OnStart) screen is created automatically.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreate' }
            example: { name: SAR, description: Sistema de Administración de Requerimientos, platform: Power Apps, jiraProjectKey: TECHEA }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /applications/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Applications]
      operationId: getApplication
      x-capability: 'Manage applications (proposed row)'
      x-roles: [ADMINISTRATOR, DEVELOPER, READER]
      summary: Get an application
      description: 'Roles: all.'
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The application
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
