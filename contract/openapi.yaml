            application/json:
              schema: { $ref: '#/components/schemas/VariableEnvelope' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Variables]
      operationId: updateVariable
      x-capability: 'CRUD of variables and collections'
      x-roles: [ADMINISTRATOR, DEVELOPER]
      summary: Replace a variable's editable data
      x-error-codes: [APPLICATION_ARCHIVED, INVALID_ORIGIN_SCREEN, SCOPE_CONFLICT, CONTEXT_SCREEN_MISMATCH, DUPLICATE_NAME]
      description: |
        Roles: Administrator, Developer. `applicationId` cannot change.
        Changing `scope` is rejected (422 SCOPE_CONFLICT) while Set/UpdateContext
        links incompatible with the new scope exist.
        When the application is archived it is read-only (CP-01): this operation
        returns 422 APPLICATION_ARCHIVED for every role.
        Context variables belong to their origin screen (CP-07): from any other screen
        a context variable can only be written (WRITE, as Navigate does);
        READ/READ_WRITE links and UpdateContext assignments elsewhere, and any link to
        a context variable without origin, return 422 CONTEXT_SCREEN_MISMATCH.
        Enforced by the database at commit (migration context_screen_rule).
        `If-Match` is always checked when sent, also when the body changes nothing.
        An update that changes nothing writes nothing: it answers 200 with the same
        `ETag` and `updatedAt`. The business rules are applied in this order:
        INVALID_ORIGIN_SCREEN (the origin screen follows the same rules as in
        `POST /variables`), SCOPE_CONFLICT, CONTEXT_SCREEN_MISMATCH. The name must be
        free where DUPLICATE_NAME says (409). The environments are replaced by
        difference, and a change in them also moves the `ETag`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariableUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariableEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/RuleViolation' }
    delete:
      tags: [Variables]
      operationId: deleteVariable
      x-capability: 'CRUD of variables and collections'
      x-roles: [ADMINISTRATOR, DEVELOPER]
      summary: Delete a variable
      x-error-codes: [APPLICATION_ARCHIVED]
      description: |
        Roles: Administrator, Developer. Its links and dependencies are deleted in
        cascade; the audit log keeps every deleted row (NFR-20).
        When the application is archived it is read-only (CP-01): this operation
        returns 422 APPLICATION_ARCHIVED for every role.
      responses:
        '204': { description: Deleted, headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RuleViolation' }
