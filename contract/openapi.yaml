              schema: { $ref: '#/components/schemas/VariableEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /variables/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Variables]
      operationId: getVariable
      x-capability: 'CRUD of variables and collections'
      x-roles: [ADMINISTRATOR, DEVELOPER, READER]
      summary: Get a variable with its links
      description: 'Roles: all.'
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The variable
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
