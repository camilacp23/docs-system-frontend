      x-error-codes: [APPLICATION_ARCHIVED, INVALID_ORIGIN_SCREEN, DUPLICATE_NAME]
      description: |
        Roles: Administrator, Developer. The variable is linked to the dependency
        map automatically (FR-06): it becomes a node, and its origin screen gets a
        WRITE link with `usedIn = origin`.
