openapi: 3.1.0
info:
  title: Technical Documentation System API
  version: 0.3.3
  summary: REST API contracts — SDD Interface Viewpoint (Bitácora 3, Activities 5 and 6)
  description: |
    Contracts of the eleven modules (41 operations of SRS Table 25), the
    Applications resource (NFR-16), the saved-reports operations (FR-22), and
    the Jira Cloud webhook.

    Conventions (SDD Section 7.1):
    - Base path `/api/v1`, HTTPS only (NFR-04), JSON UTF-8, fields in camelCase.
    - Collections: `{ data, page, pageSize, total }`. Single resources: `{ data }`.
    - Errors: `{ code, message, details }` (SRS 3.7).
    - Element listings require `applicationId`.
    - PUT replaces the whole editable representation, nested arrays included.
    - Optional optimistic concurrency: send `If-Match` with the `ETag` of the
      last read; a mismatch returns 412.
    - Every GET returns an `ETag`. Send it back in `If-None-Match`: when nothing
      changed the answer is 304 with no body.
    - Every response, success or error, carries the `X-Request-Id` header. A
      value sent by the client is kept when it has 8 to 64 characters among
      letters, digits, `.`, `_` and `-`; otherwise the server generates one.
      `INTERNAL_ERROR` repeats it in `details.requestId`.
    - Writes on variables and collections check, in this order: the shape of the request (400), that the
      referenced resources exist (404), that the application is not archived
      (422 `APPLICATION_ARCHIVED`), `If-Match` (412), the business rules (422)
      and the name (409 `DUPLICATE_NAME`).
    - Authorization: every endpoint validates the role (NFR-03); the role and
      status are read from the database on each request, not trusted from the
      token, so role changes and deactivations take effect immediately.
    - Each operation declares `x-capability` (row of SRS Table 26), `x-roles`
      (empty = no user role: public, session cookie, or Jira signature) and,
      when a data rule applies, `x-rule`. The authorization middleware is
      generated from these extensions (SDD Section 11).
    - Every user-facing `message` is in English (CP-04). Values in `<...>` are
      filled in from `details`.

    Changes in 0.3.0 (design review of 5 Oct 2026, CP-01 to CP-11; SDD D-47 to D-58):
    archived applications are read-only (CP-01); `GET /search` without `q` (CP-03);
    English messages (CP-04); `topComponents` in onboarding (CP-05); reserved
    integration account (CP-06); context variables belong to their origin screen
    (CP-07); no editing while in review (CP-08); sort by `pendingSubtasks` (CP-09);
    report `parameters` in the detail (CP-10); review decision on comments (CP-11).
    No operation was added or removed (50).

    Changes in 0.3.1 (Phase 3 decisions D-61 and D-64): `SessionResponse.data`
    gains the required `sessionExpiresIn` (seconds until the absolute end of the
    12 h session; returned by login and refresh). `CONTEXT_SCREEN_MISMATCH` also
    covers a context variable that has no origin screen, with its own message and
    `details`. The `ETag` header is now documented on the 201 of `POST /users` and
    on the 200 of `PUT /users/{id}/role`. No operation was added or removed (50).

    Changes in 0.3.2 (applications): the `ETag` header is now documented on the
    201 of `POST /applications`. `GET /applications` states its default order
    (name ascending, then id). `PUT /applications/{id}` states its full-replacement
    semantics: an omitted `description` or `jiraProjectKey` is stored as null.
    No operation was added or removed (50).

    Changes in 0.3.3 (variables and collections): every response documents the
    `X-Request-Id` header, and every GET documents the `ETag` header, the
    `If-None-Match` parameter and the 304 response. The 401 of
    `POST /auth/refresh` is `REFRESH_INVALID`, and `POST /auth/refresh` and
    `POST /auth/logout` declare the 403 FORBIDDEN (`details.reason = ORIGIN`) they
    return when the request does not come from the frontend's Origin. Listings answer 404 for an
    `applicationId` that does not exist, and `POST /variables` and
    `POST /collections` answer 404 for a referenced resource that does not exist
    and send the `ETag` of the created resource. `DUPLICATE_NAME` states the
    scope where a name must be unique and its `details.container`.
    `INVALID_ORIGIN_SCREEN` has a second message for an origin screen of another
    application, which replaces `CROSS_APPLICATION` in `POST /variables`.
    `CROSS_APPLICATION`, `SCOPE_MISMATCH` and `CONTEXT_SCREEN_MISMATCH` on
    collections name the failing item in `details.field`, and the order in which
    the rules are applied is documented. `PUT /variables/{id}` and
    `PUT /collections/{id}` document `If-Match` and the update that changes
    nothing; `PUT /collections/{id}` documents that omitted arrays are emptied,
    and its nested ids answer 404 `details.field` when they are not found.
    `derivedFrom` states its direction, that a collection cannot derive from
    itself (400, rule `self`) and that cycles are allowed. A repeated environment
    or `derivedFrom` item is a 400 with its position: `uniqueItems` was removed
    from those three arrays so that the server reports them all the same way.
    `untraced=false` and `undocumented=false` are the same as omitting them, and
    a filter by an id that does not exist returns an empty page. The `screens`
    of `GET /variables/{id}/dependencies` no longer say they include the origin
    row. `x-error-codes` now lists `DUPLICATE_NAME` on the operations that can
    return it and no longer lists `CROSS_APPLICATION` on `PUT /variables/{id}`.
    No operation was added or removed (50).

    Error catalog (`code` -> HTTP status: `message`):

    | Code | HTTP | Message |
    |---|---|---|
    | VALIDATION_ERROR | 400 | Check the highlighted fields. |
    | INVALID_CREDENTIALS | 401 | The email or password is incorrect. |
    | UNAUTHENTICATED, TOKEN_EXPIRED | 401 | Your session is not valid. Sign in again. |
    | REFRESH_INVALID | 401 | Your session ended. Sign in again to continue. |
    | INVALID_SIGNATURE | 401 | Invalid webhook signature. (Jira only) |
    | FORBIDDEN | 403 | Your role doesn't allow this action. (`details`: requiredRoles) |
    | FORBIDDEN (origin) | 403 | This request's origin isn't allowed. (`details`: reason = ORIGIN; refresh and logout only) |
    | NOT_FOUND | 404 | This <element> doesn't exist. It may have been deleted. |
    | DUPLICATE_NAME | 409 | A <type> named <name> already exists in <application>. (`details`: field, type, name, application, container) |
    | EMAIL_TAKEN | 409 | A user with this email already exists. |
    | REPORT_NOT_READY | 409 | Only ready reports can be published or downloaded. |
    | PRECONDITION_FAILED | 412 | Someone else saved changes to this <element> after you opened it. Reload to see their version. |
    | PAYLOAD_TOO_LARGE | 413 | This is too much text to save at once. Shorten the longest fields and try again. |
    | SCOPE_MISMATCH | 422 | Set applies to global variables and UpdateContext to context variables. |
    | SCOPE_CONFLICT | 422 | You can't change the scope while collections assign this variable with <function>. Update those assignments first. |
    | CROSS_APPLICATION | 422 | You can only link elements of the same application. |
    | INVALID_ORIGIN_SCREEN | 422 | Context variables are created inside a screen, not in App (OnStart). (`details`: field) |
    | INVALID_ORIGIN_SCREEN (other application) | 422 | <screen> belongs to another application. Choose a screen of <application>. (`details`: field, screenId, screen, application) |
    | CONTEXT_SCREEN_MISMATCH | 422 | <variable> belongs to <screen>. From here you can only write it with Navigate. (`details`: variableId, variable, originScreenId, screen, screenId, targetScreen) |
    | CONTEXT_SCREEN_MISMATCH (no origin screen) | 422 | <variable> has no origin screen. Set its origin screen before linking it. (`details`: variableId, variable, originScreenId: null, screenId, targetScreen) |
    | LAST_ACTIVE_ADMIN | 422 | There must be at least one active administrator. Promote another user first. |
    | CANNOT_DEACTIVATE_SELF | 422 | You can't deactivate your own account. |
    | RESERVED_ACCOUNT | 422 | This is a system account and can't be changed. |
    | APPLICATION_ARCHIVED | 422 | This application is archived, so its documentation can't be changed. |
    | INVALID_TRANSITION | 422 | This screen changed status meanwhile. Reload to see its current status. |
    | NOT_IN_REVIEW | 422 | This screen is no longer in review. Reload to see its status. |
    | SCREEN_IN_REVIEW | 422 | This screen is in review. Edit it after the review, or withdraw it from review. |
    | TEMPLATE_INCOMPLETE | 422 | Complete all seven template fields to submit for review. Missing: <fields>. |
    | COMMENT_REQUIRED | 422 | Write a comment: it is required to return the documentation. |
    | REVIEW_COMMENT_LOCKED | 422 | Review decisions can't be edited. |
    | APP_CONTEXT_PROTECTED | 422 | The App (OnStart) screen can't be deleted. |
    | STORY_NOT_IN_SCREEN | 422 | That story doesn't belong to this screen. Refresh the list and pick again. |
    | RATE_LIMITED | 429 | Too many attempts. Try again in <n> minutes. |
    | INTERNAL_ERROR | 500 | Something went wrong on our side. Try again in a moment. Reference: <requestId>. |
    | JIRA_UNAVAILABLE | 502 | Jira isn't responding. The to-do wasn't created. Try again in a few minutes. |
    | JIRA_PARTIAL_FAILURE | 502 | The story <key> was created, but the to-do wasn't. Try again to add it to that story. |

    In `DUPLICATE_NAME`, `<type>` is the noun in lowercase (`global variable`,
    `context variable`, `collection`, `application`; `An` before a vowel) and
    `<application>` is the place where the name must be unique, which
    `details.container` names: `application` (global variables, collections and
    context variables without an origin screen: the name of the application),
    `screen` (context variables with an origin screen: the name of that screen) or
    `system` (applications: Documentación técnica).

    Each operation that can answer 422 lists its possible codes in `x-error-codes`.
  contact:
    name: Enterprise Architecture Department
  license:
    name: Internal use - Enterprise Architecture Department, Universidad Latina de Costa Rica
